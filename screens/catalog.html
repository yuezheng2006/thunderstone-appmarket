<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>分类 - ThunderStone 应用市场</title>
  <link rel="stylesheet" href="../assets/system.css">
</head>
<body>
  <div id="app">
  <div class="shell" data-shell>
    <main class="main catalog-main">
      <div class="catalog-layout">
        <aside class="category-sidebar">
          <div class="chip-row stack" data-category-chips></div>
        </aside>
        <section class="catalog-results">
          <div class="section-head">
            <h2 data-catalog-title>全部应用</h2>
            <div class="segmented" aria-label="安装状态">
              <button class="active" data-segment="all">全部</button>
              <button data-segment="installed">已装</button>
              <button data-segment="update">升级</button>
            </div>
          </div>
          <div class="catalog-scroll">
            <div class="app-grid" data-app-list></div>
            <div class="pager" data-pager></div>
            <div class="empty" data-empty>没有找到匹配的应用</div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div class="toast" data-toast-box></div>
  </div>
  <script src="../assets/app.js"></script>
  <script>initPage('分类');</script>
</body>
</html>
